# Read by OpenRig when it builds this rig into a bundle.
#
# compatibility: the oldest OpenRig CLI that a build from the GitHub link works
# with (GitHub links need 0.6.6). A build from a local folder takes its minimum
# from --min-cli-version instead.
compatibility:
  min_cli_version: "0.6.6"

# preconditions: what to know and do before installing, shown before install.
# Run the commands in order in one shell, then run the install command in that
# same shell. OpenRig shows them; it doesn't run or check them.
preconditions:
  - name: "Install and run the rig as your normal user, not root: Claude Code refuses to bypass permissions as root or under sudo."
  - name: Set up a clone of openrig, add this repository's context pack, and run the install from the root of that clone.
    commands:
      - git clone https://github.com/mvschwarz/openrig.git
      - cd openrig
      - npm ci
      - npm run build
      - rig context add --git https://github.com/mvschwarz/openrig-world
  - name: "rig context add needs the OpenRig daemon running. rig up starts the daemon by itself, but this step comes first, so if rig context add stops with \"Daemon not running.\", run rig daemon start and then add the pack again."
  - name: "If you ask Claude Code to do this setup for you, plan to run some steps yourself. In OpenRig's test on macOS with Claude Code 2.1.289, its default auto mode declined three of them: cloning and building the openrig repository ([Code from External]), so run the clone and the build yourself; adding a permission rule for itself ([Self-Modification]), which auto mode doesn't let Claude do, so add any rule yourself with /permissions or in .claude/settings.local.json; and rig context add --git ([Untrusted Code Integration]), even with an allow rule for that command, so run it yourself."
  - name: "Before your first install on a machine, run claude --dangerously-skip-permissions once in the clone, accept its prompts (including Claude Code's bypass warning), then type /exit. Claude Code remembers it, so the seats start without stopping."
